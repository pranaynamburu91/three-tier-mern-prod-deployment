services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./frontend:/app
    networks:
     - frontend_network
    depends_on:
     - backend
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    restart: always
    networks:
      - frontend_network
      - backend_network
      - db_network
    environment:
     - PORT=5555
     - MONGODB_URL=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/<database>?retryWrites=true&w=majority
    volumes:
      - ./backend:/app
    depends_on:
     - db
  db:
    image: mongodb:7
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - ./data:/data/db
    environment:
      - DB_NAME=mydatabase
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
    networks:
      - db_network
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  db_network:
    driver: bridge