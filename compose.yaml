services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    restart: always
    volumes:
      - ./frontend:/app
    networks:
      - frontend_network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5555:5555"
    restart: always
    networks:
      - frontend_network
      - backend_network
      - db_network
    environment:
      PORT: 5555
      MONGODB_URL: mongodb://db:27017/bookstore
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - ./data:/data/db
    environment:
      MONGO_INITDB_DATABASE: bookstore
    networks:
      - db_network

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  db_network:
    driver: bridge