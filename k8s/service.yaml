apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mernapp
spec:
  type: NodePort
  ports:
  - port: 80          # Port exposed within the cluster
    targetPort: 5173  # Port on the pods
    nodePort: 30000   # Port accessible externally on each node
  selector:
    app: frontend  # Select pods with this label

...
---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: mernapp
spec:
  type: NodePort
  ports:
  - port: 80          # Port exposed within the cluster
    targetPort: 5555  # Port on the pods
    nodePort: 30000   # Port accessible externally on each node
  selector:
    app: backend  # Select pods with this label

...
---

apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: mernapp
spec:
  type: NodePort
  ports:
  - port: 80          # Port exposed within the cluster
    targetPort: 27017  # Port on the pods
    nodePort: 30000   # Port accessible externally on each node
  selector:
    app: db  # Select pods with this label